name: Feature idea
description: Suggest an improvement to PVault
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PVault stays deliberately small: offline first, no accounts, no tracking, mobile first.
        Ideas that need a backend, a login, or analytics are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
  - type: checkboxes
    id: principles
    attributes:
      label: Fit check
      options:
        - label: This works offline and does not require an account or a server
          required: true
